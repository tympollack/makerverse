name: Dispatch Drop Alerts Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Makerverse drop alert dispatcher
        env:
          BASE_URL: ${{ vars.MAKERVERSE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Skipping drop alert cron: MAKERVERSE_BASE_URL or CRON_SECRET is not set."
            exit 0
          fi
          curl --fail --silent --show-error -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/cron/dispatch-drop-alerts"
